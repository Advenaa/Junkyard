name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: podders
          POSTGRES_PASSWORD: podders
          POSTGRES_DB: podders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U podders"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Build (TypeScript + Vite dashboard)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://podders:podders@localhost:5432/podders_test

      - name: Run dashboard tests
        run: npm run test:dashboard

  # Integration tests require real API keys configured as GitHub secrets:
  # ANTHROPIC_API_KEY, GEMINI_API_KEY, TWITTERAPI_KEY
  integration:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true # API keys may not be configured yet

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: podders
          POSTGRES_PASSWORD: podders
          POSTGRES_DB: podders_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U podders"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && cd dashboard && npm ci

      - name: Build
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://podders:podders@localhost:5432/podders_integration
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ~/podders

            OLD_HASH=$(git rev-parse HEAD)
            echo "Current: $OLD_HASH"

            git fetch origin main
            git reset --hard origin/main

            npm ci --production=false
            cd dashboard && npm ci && cd ..

            if ! npm run build; then
              echo "BUILD FAILED — rolling back to $OLD_HASH"
              git checkout "$OLD_HASH"
              npm ci --production=false
              cd dashboard && npm ci && cd ..
              npm run build
              exit 1
            fi

            if ! node dist/index.js migrate; then
              echo "MIGRATION FAILED — rolling back to $OLD_HASH"
              git checkout "$OLD_HASH"
              npm ci --production=false
              cd dashboard && npm ci && cd ..
              npm run build
              exit 1
            fi

            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            for i in $(seq 1 12); do
              HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" != "000" ]; then
                echo "Health check passed (attempt $i, HTTP $HTTP_CODE)"
                echo "Deployed: $(git rev-parse --short HEAD)"
                exit 0
              fi
              echo "Waiting for server to start (attempt $i/12)..."
              sleep 10
            done

            echo "HEALTH CHECK FAILED — server not responding"
            exit 1
